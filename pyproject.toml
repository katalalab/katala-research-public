[project]
name = "katala-research"
version = "0.1.0"
description = "Anti-filter-bubble deep-research agent with creativity-aware scoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolas Ogoshi" }]
dependencies = [
  "anthropic>=0.39.0",
  "httpx>=0.27.0",
  "pydantic>=2.5.0",
  "pyyaml>=6.0",
  "tenacity>=8.2.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7.0"]
scrape = ["scrapling>=0.2.0", "pypdf>=4.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
kr = "katala_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katala_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
